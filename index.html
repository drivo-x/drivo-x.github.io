<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css">
<style>
  :root {
    --bg: #0b0c0f;
    --card: #15171c;
    --card-hover: #1c1f26;
    --line: #262a33;
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --accent: #ff3b30;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255, 59, 48, .18), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 500 16px/1.5 Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }

  .mark {
    width: 92px; height: 92px; margin: 0 auto 18px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #1d2027, #0f1014);
    border: 1px solid var(--line);
    box-shadow: 0 0 0 4px rgba(255, 59, 48, .12), 0 12px 30px rgba(0, 0, 0, .5);
    font: 700 34px/1 Rajdhani, sans-serif; letter-spacing: .5px;
  }
  .mark b { font-weight: 700; white-space: nowrap; }
  .mark span { color: var(--accent); }
  h1 {
    margin: 0;
    font: 700 34px/1.1 Rajdhani, sans-serif;
    letter-spacing: 1px;
  }
  h1 span { color: var(--accent); }
  .tag {
    margin: 8px 0 4px;
    color: var(--muted);
    font-size: 15px;
  }
  .ar {
    margin: 0 0 28px;
    color: var(--muted);
    font: 500 14px/1.6 Cairo, sans-serif;
  }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
  .chip {
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
  }

  nav { display: grid; gap: 12px; }
  nav a {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    font-weight: 600; font-size: 16px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  nav a:hover, nav a:focus-visible { background: var(--card-hover); border-color: #3a3f4b; transform: translateY(-1px); outline: none; }
  nav a i { width: 22px; font-size: 20px; text-align: center; }
  nav a .name { flex: 1; text-align: left; }
  nav a .handle { color: var(--muted); font-weight: 500; font-size: 14px; }
  nav a.main { border-color: rgba(255, 59, 48, .5); }

  .yt i { color: #ff0033; }
  .tt i { color: #fff; text-shadow: 1.5px 1.5px 0 #fe2c55, -1.5px -1.5px 0 #25f4ee; }
  .ig i { color: #e1306c; }
  .sc i { color: #fffc00; }
  .x  i { color: #fff; }
  .th i { color: #fff; }
  .fb i { color: #1877f2; }

  footer { margin-top: 34px; color: #5d636e; font-size: 12px; letter-spacing: .3px; }

  @media (prefers-reduced-motion: reduce) { nav a { transition: none; } nav a:hover { transform: none; } }
</style>
</head>
