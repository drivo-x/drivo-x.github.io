<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DrivoX - ربط حساب</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0f1626; color: #e6e9ef; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  .wrap { padding: 24px 16px; text-align: center; max-width: 520px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #a7b0c0; line-height: 1.7; margin: 0; }
  .err { color: #f87171; }
  a { color: #3ecf8e; }
  #fallback { margin-top: 22px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="headline">عم نكمّل الربط…</h1>
  <p id="detail">عم نرجّع الإذن لـ OmniPost على كمبيوترك.</p>
  <p id="fallback" hidden>إذا ما صار شي، تأكد إنه OmniPost شغّال و<a id="manual" href="#">اضغط هون</a>.</p>
</div>
<script>
// OmniPost (DrivoX) sign-in return page.
// Some platforms only accept a public https address as the place to come back
// to after a sign-in. This static page is that address: it hands the
// authorisation code straight to OmniPost on this computer (127.0.0.1) and
// nowhere else. Nothing is stored or sent anywhere; no scripts from elsewhere.
(function () {
  var params = new URLSearchParams(window.location.search);
  // Threads wraps the state in quotes.
  var state = (params.get("state") || "").replace(/^["'\s]+|["'\s]+$/g, "");
  var platform = state.split(".")[0];
  var VALID = ["tiktok", "instagram", "facebook", "youtube", "threads", "blogger"];

  function fail(message) {
    var h = document.getElementById("headline");
    h.textContent = "ما زبط الربط";
    h.className = "err";
    document.getElementById("detail").textContent = message;
  }

  if (params.get("error")) {
    fail("المنصة رجّعت: " + (params.get("error_description") || params.get("error")));
    return;
  }
  if (!state) {
    document.getElementById("headline").textContent = "ما في شي نكمّله";
    document.getElementById("detail").textContent =
      "هالصفحة بتشتغل بس لما ترجع لها منصة بعد ما تربط حساب من OmniPost.";
    return;
  }
  if (VALID.indexOf(platform) === -1) {
    fail("ما عرفنا من أي منصة جاي الربط. ابدأ الربط من جديد من OmniPost.");
    return;
  }

  var port = params.get("port") || "8000";
  if (!/^\d{2,5}$/.test(port)) port = "8000";
  params.set("state", state);
  var target = "http://127.0.0.1:" + port + "/auth/" + platform + "/callback?" + params.toString();

  document.getElementById("manual").href = target;
  document.getElementById("fallback").hidden = false;
  window.location.replace(target);
})();
</script>
</body>
</html>
